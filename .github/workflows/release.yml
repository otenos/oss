# On every push to main: if there are changesets, open or update the
# "Version packages" pull request; when that pull request is merged, publish
# the new versions to npm.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in this
# repository. Each package must list this repository and this workflow file
# as its trusted publisher on npmjs.com.
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish
          commit-message: Version packages
          pr-title: Version packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'
